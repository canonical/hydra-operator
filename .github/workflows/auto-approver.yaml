name: auto-approver
run-name: CI for approving PRs

on:
  push:
    branches:
      - "renovate/**"
      - "automated-update-charm-libs"

jobs:
  auto-approve:
    name: Auto-approve and merge pull request
    uses: canonical/identity-team/.github/workflows/pr-auto-approval.yaml@990a60c1a8f3017af7236b91f0e24eb2e7999657 # v1.19.1
    secrets:
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
